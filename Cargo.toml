[workspace]
resolver = "3"
# One crate per adapter, grouped by what it adapts.
members = ["agents/*", "trackers/*", "forges/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/tinyish/fleet-adapters"

[workspace.dependencies]
# The adapter protocol and its kit, pinned by its tag on tinyfleet.
fleet-adapter-sdk = { git = "https://github.com/tinyish/fleet", tag = "adapter-sdk-v0.2.0", features = ["kit"] }
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"
