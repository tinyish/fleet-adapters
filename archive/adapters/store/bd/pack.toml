[pack]
name = "bd"
version = "0.1.0"
schema = 3
description = "The beads store: bd 1.3.0 behind the store contract."

# The adapter is written for Deno, and Deno is pinned by the ts pack, so this
# pack imports that one rather than pinning a runtime of its own. The path is
# read from this pack's own directory, adapters/store/bd/, and climbs to the
# repository's runtimes/ts.
[imports.ts]
source = "../../../runtimes/ts"
version = "0.1.0"
